name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name limbos32 --add-data "LIMBO.mp3;." --add-data "error.mp3;." --add-data "key.png;." --add-data "green-key.png;." --add-data "key0.png;." --add-data "key1.png;." --add-data "key2.png;." --add-data "key3.png;." --add-data "key4.png;." --add-data "key5.png;." --add-data "key6.png;." --add-data "key7.png;." main.py

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: limbos32-windows
          path: dist/limbos32.exe
          
